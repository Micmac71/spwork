<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modèles 3D SP WORK</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --gris: #4B5157; --rouge: #E03A14; --fond: #EEF0F2; --texte: #26303A; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Barlow, Arial, sans-serif; background: var(--fond); color: var(--texte); }
  header { background: var(--gris); color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-family: "Barlow Condensed", sans-serif; font-size: 1.5rem; margin: 0; flex: 1; }
  button { font: 600 1rem Barlow, sans-serif; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; background: #fff; color: var(--texte); }
  button.principal { background: var(--rouge); color: #fff; }
  main { padding: 16px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .carte { background: #fff; border-radius: 10px; overflow: hidden; }
  .carte canvas { width: 100%; aspect-ratio: 4 / 3; display: block; background: linear-gradient(#F7F8F9, #DDE2E6); }
  .carte div { padding: 8px 12px; display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }
  .carte a { color: var(--rouge); font-weight: 600; }
  #etat { padding: 0 16px; font-size: .95rem; }
</style>
</head>
<body>
<header>
  <h1>Modèles 3D de l'accueil (glTF)</h1>
  <button id="generer" class="principal" type="button">Générer les modèles</button>
  <button id="enregistrer" type="button" disabled>Enregistrer dans modeles/</button>
</header>
<p id="etat">Cette page fabrique les fichiers .glb chargés par l'écran d'accueil. Chaque aperçu est relu depuis le fichier exporté.</p>
<main id="cartes"></main>
<script src="../js/vendor/three.min.js"></script>
<script src="../js/vendor/three-extras.js"></script>
<script src="../js/glb.js"></script>
<script src="modeles-3d.js"></script>
</body>
</html>
